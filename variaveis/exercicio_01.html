<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Programa para indentificar vizinhos</title>
</head>
<body>
    <script>
        let numero = Number(prompt("Insira um número"))
        let vizinhopost = numero +1
        let vizinhoante = numero -1
        alert ("Para o número "+ numero + " teremos "+ vizinhopost + " como posterior e " + vizinhoante + " como anterior.")
    </script>
</body>
</html>
