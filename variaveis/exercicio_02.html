<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.Programa para pizzaria</title>
</head>
<body>
    <script>
        let conta = Number(prompt("Qual o valor total da conta?"))
        let clientes = Number(prompt("Qual a quantidade de clientes que a conta irá ser dividida?"))
        let valor = conta / clientes
        alert("Valor total: R$" + conta.toFixed(2))
        alert ("A conta será de R$" + valor.toFixed(2) + " para cada cliente")
    </script>
</body>
</html>
