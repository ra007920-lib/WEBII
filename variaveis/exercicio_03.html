<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. casas bahia</title>
</head>
<body>
    <script>
        let preco = Number(prompt("Insira o valor do produto desejado"));
        let vista = preco * 0.9;
        let prazo = preco / 3;
        alert("Valor: R$"+ preco.toFixed(2));
        alert("À vista: R$"+ vista.toFixed(2)+ " Ou 3x de R$"+ prazo.toFixed(2))
    </script>
</body>
</html>
