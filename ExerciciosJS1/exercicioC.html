<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Supermercado JS</title>
        <link rel="stylesheet" href="css/bootstrap.min.css" />
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col">
                    <h1>Supermercado JS</h1>
                    <form action="">
                        <p>Produto: <input type="text" id="inProduto" required /></p>
                        <p>Valor R$: <input type="number" id="inPreco" min="0" step="0.01" required /></p>
                        <input type="submit" value="Ver Promoção" class="btn btn-warning" />
                    </form>
                    <h3></h3>
                </div>
            </div>
        </div>
        <script src="js/exemploC.js"></script>
    </body>
</html>
