<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Repete Frutas</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <img src="imagens/exerc.jpg" alt="calculadora" class="img-fluid">
            </div>

            <div class="col-9">
                <h1>Programa Repete Frutas</h1>
                <hr>

                <form>
                    <p>Fruta: 
                        <input type="text" id="inFruta" required>

                    </p>

                    <p>Número:
                        <input type="number" id="inNumero" min="1" required>
                    </p>
                    <input type="submit" value="Repetir fruta"  class="btn btn-primary">
                    <input type="reset" value="Resetar campos."  class="btn btn-primary">

                    
                
                </form>
                <h3></h3>

            </div>
        </div>
    </div>
    <script src="js/ex01.js"></script>
</body>
</html>
