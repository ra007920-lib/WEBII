<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Criação de Chinchilas</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <img src="imagens/exerc.jpg" alt="calculadora" class="img-fluid">
            </div>
            <div class="col-9">
                <h1>Programa Criação de Chinchilas</h1>
                <hr>

                <form>
                    <p>Número inicial de chinchilas: 
                        <input type="number" id="inChinchilas" min = "2" required>
                    </p>

                    <p>Número de anos:
                        <input type="number" id="inAnos" min="1" required>

                    </p>
                    <input type="submit" value="Mostrar Previsão" class="btn btn-primary">
                    <input type="reset" value="Resetar campos" class="btn btn-success">
                </form>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/ex02.js"></script>
    
</body>
</html>
