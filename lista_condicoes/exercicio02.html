<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Verifica Velocidade</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-4">
                    <img src="imagens/exerc.jpg" alt="programa" class="img-fluid" />
                </div>
                <div class="col-8">
                    <h1>Programa Verifica Velocidade</h1>
                    <form action="">
                        <p>Velocidade Permitida: <input type="number" id="inPermitida" min="0" step="0.1" required /></p>
                        <p>Velocidade Atual: <input type="number" id="inVelocidade" min="0" step="0.1" required /></p>
                        <input type="submit" value="Verificar Velocidade" class="btn btn-success" />
                    </form>
                    <p>&nbsp;</p>
                    <pre id="outResp1"></pre>
                </div>
            </div>
        </div>
        <script src="js/ex02.js"></script>
    </body>
</html>
